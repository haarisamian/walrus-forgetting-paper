name: walrus-cylinder
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg  # required by matplotlib for video generation — must be on PATH
  - pip:
    # PyTorch — Swirles (x86_64, CUDA 12.1): torch==2.5.1+cu121 --index-url https://download.pytorch.org/whl/cu121
    # Isambard GH200 (aarch64): plain PyPI build includes CUDA support
    - torch==2.5.1
    - torchvision==0.20.1
    - torchaudio==2.5.1
    # Core walrus deps (pinned as declared in walrus/pyproject.toml)
    - numpy==1.26.4
    - pandas==2.2
    - einops>=0.8,<0.9
    - h5py>=3.9.0,<4
    - hydra-core>=1.3,<2
    - imageio>=2.25,<3
    - imageio-ffmpeg==0.6.0
    - matplotlib>=3.8,<4
    - plotly>=5.0,<6
    - timm>=1.0,<2
    - torchinfo>=1.8.0,<2
    - wandb>=0.17.9
    - the_well[benchmark] @ git+https://github.com/PolymathicAI/the_well.git@master
    # RealPDEBench deps (beyond walrus overlap)
    - scipy
    - seaborn
    - tqdm
    - pyyaml
    - tensorboard
    - einops-exts
    - rotary-embedding-torch
    - PyWavelets
    - psutil
    - requests
    - huggingface-hub
    - datasets
    # Install packages from repo (run after env creation)
    # pip install -e /path/to/walrus/
    # pip install git+https://github.com/AI4Science-WestlakeU/RealPDEBench.git
